# Continuous deployment: every push to main passes CI and publishes dist/ to the landing
# bucket, then invalidates CloudFront. The infrastructure (infra/) is applied locally; this
# workflow only holds the deploy role from infra/github_oidc.tf, which can do nothing else.
# Where to deploy comes from AWS (SSM, written by the stack), not from GitHub: the only
# variable it needs is AWS_DEPLOY_ROLE_ARN on the `production` environment.
# Order across repositories: api → web → landing (docs in infra/README.md).
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits instead of cancelling a half-uploaded one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to production
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.stack.outputs.site_url }}
    permissions:
      contents: read
      id-token: write # OIDC: assume the deploy role without stored AWS keys
    env:
      TF_ENV: prod
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
    steps:
      - name: Check the environment is set up (infra/README.md)
        run: |
          if [ -z "$AWS_DEPLOY_ROLE_ARN" ]; then
            echo "::error::Variable AWS_DEPLOY_ROLE_ARN is not set on the 'production' environment (see infra/README.md)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same project_name and region Terraform uses, so the SSM path matches the stack.
      - name: Read the stack settings from the env tfvars
        id: settings
        run: |
          tfvars="infra/envs/$TF_ENV/$TF_ENV.tfvars"
          value() { sed -n "s/^$1 *= *\"\(.*\)\"/\1/p" "$tfvars"; }
          project="$(value project_name)"
          region="$(value region)"
          [ -n "$project" ] || { echo "::error::project_name is not set in $tfvars"; exit 1; }
          # Unset in the tfvars means the variable's default in infra/variables.tf.
          echo "prefix=/$project/$TF_ENV" >> "$GITHUB_OUTPUT"
          echo "region=${region:-us-east-1}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ steps.settings.outputs.region }}

      - name: Read the deploy targets from SSM
        id: stack
        env:
          PREFIX: ${{ steps.settings.outputs.prefix }}
        run: |
          # A parameter that does not exist (yet) reads as empty; any other failure (access,
          # throttling, a wrong region) stops the deploy instead of passing for "missing".
          param() {
            local err="$RUNNER_TEMP/ssm-error"
            if aws ssm get-parameter --name "$PREFIX/$1" --query Parameter.Value --output text 2>"$err"; then
              return 0
            fi
            grep -q ParameterNotFound "$err" && return 0
            cat "$err" >&2
            return 1
          }
          bucket="$(param landing/bucket)"
          distribution_id="$(param landing/distribution_id)"
          site_url="$(param landing/url)"
          if [ -z "$bucket" ] || [ -z "$distribution_id" ] || [ -z "$site_url" ]; then
            echo "::error::$PREFIX/landing/* is missing: apply infra/ first (infra/README.md)"
            exit 1
          fi
          # The web app (mvp-web writes web/url). Until it exists, its links fall back to
          # this site, where they show the 404 page instead of pointing at localhost.
          app_url="$(param web/url)"
          if [ -z "$app_url" ]; then
            echo "::warning::$PREFIX/web/url is missing (mvp-web not deployed yet): Sign in and Try it now point at this site"
            app_url="$site_url"
          fi
          {
            echo "bucket=$bucket"
            echo "distribution_id=$distribution_id"
            echo "site_url=$site_url"
            echo "app_url=$app_url"
          } >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The PUBLIC_* values are baked into the HTML here.
      - run: pnpm build
        env:
          PUBLIC_SITE_URL: ${{ steps.stack.outputs.site_url }}
          PUBLIC_APP_URL: ${{ steps.stack.outputs.app_url }}
          # Optional, and not about AWS: a variable of the environment, blank hides the link.
          PUBLIC_REPOSITORY_URL: ${{ vars.PUBLIC_REPOSITORY_URL }}

      # Hashed assets first and cached for a year, so no new page ever points at a missing
      # file; old ones stay for pages still open. Then everything else, revalidated on
      # every request, and whatever the build no longer produces is deleted.
      - name: Upload
        env:
          BUCKET: ${{ steps.stack.outputs.bucket }}
        run: |
          aws s3 sync dist/_astro "s3://$BUCKET/_astro" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist "s3://$BUCKET" --delete --exclude "_astro/*" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront
        env:
          DISTRIBUTION_ID: ${{ steps.stack.outputs.distribution_id }}
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$id"

      - name: Smoke test
        env:
          SITE_URL: ${{ steps.stack.outputs.site_url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 \
            -o /dev/null "$SITE_URL/"
