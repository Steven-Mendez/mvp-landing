name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  security:
    uses: ./.github/workflows/security.yml
  settings:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/settings.yml
  build:
    name: Validate production artifact
    needs: [checks, security, settings]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_SITE_URL: ${{ needs.settings.outputs.site_url }}
      PUBLIC_APP_URL: ${{ needs.settings.outputs.app_url }}
      PUBLIC_REPOSITORY_URL: ${{ vars.PUBLIC_REPOSITORY_URL }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm build
      - run: node scripts/release.mjs create
      - run: pnpm test:e2e
      - run: pnpm test:lighthouse
      - run: node scripts/release.mjs verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: landing-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: production-quality-reports
          path: |
            playwright-report
            .lighthouseci
          retention-days: 14
  publish:
    needs: [settings, build]
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      run_id: ${{ github.run_id }}
      sha: ${{ github.sha }}
      region: ${{ needs.settings.outputs.region }}
      bucket: ${{ needs.settings.outputs.bucket }}
      distribution_id: ${{ needs.settings.outputs.distribution_id }}
      site_url: ${{ needs.settings.outputs.site_url }}
      app_url: ${{ needs.settings.outputs.app_url }}
