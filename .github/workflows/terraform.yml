# The plan of infra/ against the real prod state, as a comment on the pull request. It
# never applies: the infrastructure is applied locally (infra/README.md). fmt, validate,
# tflint and the offline plans run in CI for every pull request, with no account.
name: Terraform

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read
  id-token: write # OIDC: assume the read-only plan role
  pull-requests: write # the plan comment

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan (prod)
    # Off until the plan role exists (infra/github_oidc.tf); pull requests from forks get no
    # OIDC token anyway.
    if: vars.AWS_TERRAFORM_PLAN_ROLE_ARN != '' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "1"
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.4
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - run: cp infra/backend.tf.example infra/backend.tf
      - name: Init
        run: |
          [ -n "$TF_STATE_BUCKET" ] || { echo "::error::Repository variable TF_STATE_BUCKET is not set"; exit 1; }
          terraform -chdir=infra init -input=false \
            -backend-config=envs/prod/backend.hcl -backend-config="bucket=$TF_STATE_BUCKET"

      # The plan goes to a file, not into the script: its text never becomes code.
      - name: Plan
        id: plan
        continue-on-error: true
        run: |
          terraform -chdir=infra plan -no-color -input=false -lock-timeout=60s \
            -var-file=envs/prod/prod.tfvars -var "github_repository=$GITHUB_REPOSITORY" \
            -var "tf_state_bucket=$TF_STATE_BUCKET" \
            > "$RUNNER_TEMP/plan.txt" 2>&1

      - name: Comment the plan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require("fs")
            const marker = "<!-- terraform-plan -->"
            const plan = fs.readFileSync(`${process.env.RUNNER_TEMP}/plan.txt`, "utf8")
            // GitHub caps a comment at 65536 characters: keep the end, where the summary is.
            const text = plan.length > 60000 ? `…(truncated)\n${plan.slice(-60000)}` : plan
            const body = [
              marker,
              `#### Terraform plan (prod): ${process.env.OUTCOME}`,
              "<details><summary>Show the plan</summary>",
              "",
              "```",
              text.replaceAll("```", "'''"),
              "```",
              "</details>",
            ].join("\n")
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const previous = comments.find((c) => c.user.type === "Bot" && c.body.startsWith(marker))
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

      - if: steps.plan.outcome == 'failure'
        run: exit 1
